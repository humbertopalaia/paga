version: 0.2

phases:
  install:
    runtime-versions:
      dotnet: 10.0
    commands:
      - dotnet tool install --global dotnet-ef
      - export PATH="$PATH:$HOME/.dotnet/tools"

  pre_build:
    commands:
      - cd $CODEBUILD_SRC_DIR/backend && dotnet restore && dotnet build --no-restore

  build:
    commands:
      - cd $CODEBUILD_SRC_DIR/backend && dotnet test --no-build --filter "FullyQualifiedName~Unit"

  post_build:
    commands:
      - cd $CODEBUILD_SRC_DIR/backend && dotnet publish src/Paga.Api -c Release -o $CODEBUILD_SRC_DIR/publish
      - cd $CODEBUILD_SRC_DIR/backend && dotnet ef migrations script --idempotent --project src/Paga.Infrastructure --startup-project src/Paga.Api -o $CODEBUILD_SRC_DIR/publish/migrations.sql
      - cp $CODEBUILD_SRC_DIR/infra/appspec.yml $CODEBUILD_SRC_DIR/publish/appspec.yml
      - mkdir -p $CODEBUILD_SRC_DIR/publish/infra && cp -r $CODEBUILD_SRC_DIR/infra/scripts $CODEBUILD_SRC_DIR/publish/infra/scripts

artifacts:
  base-directory: publish
  files:
    - "**/*"