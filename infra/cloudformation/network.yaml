AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PAGA MVP - Network Stack.
  Creates VPC, public subnet, internet gateway, route table, and security group.

Parameters:
  Environment:
    Type: String
    Default: prod
    Description: Environment name used in resource naming and exports.

  VpcCidr:
    Type: String
    Default: "10.0.0.0/16"
    Description: CIDR block for the VPC.

  SshCidr:
    Type: String
    Description: CIDR block allowed to SSH into the EC2 instance (port 22). Required, no default.
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'
    ConstraintDescription: Must be a valid CIDR block (e.g., 203.0.113.0/32).

  CloudFrontPrefixListId:
    Type: String
    Default: pl-3b927c52
    Description: >-
      AWS-managed prefix list ID for com.amazonaws.global.cloudfront.origin-facing.
      Default is correct for us-east-1; verify for other regions.

Resources:
  # --- VPC ---
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "paga-${Environment}-vpc"

  # --- Public Subnet (AZ 'a') ---
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "paga-${Environment}-public-subnet"

  # --- Internet Gateway ---
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "paga-${Environment}-igw"

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # --- Route Table ---
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "paga-${Environment}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # --- Security Group ---
  # Port 5432 is intentionally NOT opened — PostgreSQL listens only on localhost.
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "paga-${Environment} - Allow HTTP from CloudFront, SSH from admin CIDR"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # Port 80 from CloudFront managed prefix list (CloudFront to EC2 is HTTP-only in MVP)
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
        # Port 22 from admin SSH CIDR (required parameter, no default)
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
      Tags:
        - Key: Name
          Value: !Sub "paga-${Environment}-sg"

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref Vpc
    Export:
      Name: !Sub "paga-${Environment}-vpc-id"

  SubnetId:
    Description: Public subnet ID
    Value: !Ref PublicSubnet
    Export:
      Name: !Sub "paga-${Environment}-subnet-id"

  SecurityGroupId:
    Description: Security group ID
    Value: !GetAtt SecurityGroup.GroupId
    Export:
      Name: !Sub "paga-${Environment}-sg-id"
