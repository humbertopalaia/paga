AWSTemplateFormatVersion: '2010-09-09'
Description: PAGA IAM roles and instance profile for CI/CD pipeline and EC2 runtime

Parameters:
  Environment:
    Type: String
    Default: prod
    Description: Environment name used in resource naming and exports

  ArtifactBucketArn:
    Type: String
    Description: ARN of the S3 bucket used for pipeline artifacts

  FrontendBucketArn:
    Type: String
    Description: ARN of the S3 bucket hosting the Angular SPA

  CloudFrontDistributionArn:
    Type: String
    Description: ARN of the CloudFront distribution for frontend invalidation

Resources:
  # --- CodePipeline Role ---
  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub paga-${Environment}-codepipeline-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub paga-${Environment}-codepipeline-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CodeBuildAccess
                Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                  - codebuild:StopBuild
                Resource: !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/paga-${Environment}-*
              - Sid: CodeDeployAccess
                Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:RegisterApplicationRevision
                Resource:
                  - !Sub arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:application:paga-${Environment}-*
                  - !Sub arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:paga-${Environment}-*/*
                  - !Sub arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*
              - Sid: CodeStarConnectionAccess
                Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: "*"
              - Sid: ArtifactBucketAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Ref ArtifactBucketArn
                  - !Sub ${ArtifactBucketArn}/*

  # --- CodeBuild Role ---
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub paga-${Environment}-codebuild-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub paga-${Environment}-codebuild-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ArtifactBucketAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource:
                  - !Ref ArtifactBucketArn
                  - !Sub ${ArtifactBucketArn}/*
              - Sid: CloudWatchLogsAccess
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/paga-${Environment}-*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/paga-${Environment}-*:*
              - Sid: FrontendBucketSync
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Ref FrontendBucketArn
                  - !Sub ${FrontendBucketArn}/*
              - Sid: CloudFrontInvalidation
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Ref CloudFrontDistributionArn

  # --- CodeDeploy Role ---
  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub paga-${Environment}-codedeploy-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRole
      Policies:
        - PolicyName: !Sub paga-${Environment}-codedeploy-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ArtifactBucketRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !Ref ArtifactBucketArn
                  - !Sub ${ArtifactBucketArn}/*

  # --- EC2 Instance Role + Instance Profile ---
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub paga-${Environment}-ec2-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub paga-${Environment}-ec2-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SSMParameterStoreAccess
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/paga/*
              - Sid: ArtifactBucketRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !Ref ArtifactBucketArn
                  - !Sub ${ArtifactBucketArn}/*

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub paga-${Environment}-instance-profile
      Roles:
        - !Ref EC2InstanceRole

Outputs:
  InstanceProfileArn:
    Description: ARN of the EC2 instance profile
    Value: !GetAtt EC2InstanceProfile.Arn
    Export:
      Name: !Sub paga-${Environment}-instance-profile-arn

  CodeDeployRoleArn:
    Description: ARN of the CodeDeploy service role
    Value: !GetAtt CodeDeployRole.Arn
    Export:
      Name: !Sub paga-${Environment}-codedeploy-role-arn

  CodePipelineRoleArn:
    Description: ARN of the CodePipeline service role
    Value: !GetAtt CodePipelineRole.Arn
    Export:
      Name: !Sub paga-${Environment}-codepipeline-role-arn

  CodeBuildRoleArn:
    Description: ARN of the CodeBuild service role
    Value: !GetAtt CodeBuildRole.Arn
    Export:
      Name: !Sub paga-${Environment}-codebuild-role-arn
